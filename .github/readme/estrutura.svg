<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Estrutura de arquivos-curso-tec-senac</title>
<desc id="desc">Modulo1/: primeiro módulo do curso · Alisson - POO/: Programação Orientada a Objetos · Nelma - DB/: banco de dados e SQL · Rodolfo - ALG/: algoritmos em Portugol e Java · Vanessa - ADS/: requisitos e UML (PDFs) · Modulo2/: segundo módulo do curso · Backend/: API Spring Boot (aula 22/09) · .gitignore · README.md</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="410" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="410" fill="#191817"/>
<rect width="1200" height="410" fill="url(#grid)"/>
<rect width="1200" height="40" fill="#262422"/>
<rect y="40" width="1200" height="1" fill="#3a3733"/>
<rect x="20" y="14" width="12" height="12" fill="#e5534b"/>
<rect x="40" y="14" width="12" height="12" fill="#e0a43b"/>
<rect x="60" y="14" width="12" height="12" fill="#5fb85f"/>
<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">estrutura</text>
<text x="48" y="88" class="mono" font-size="15" fill="#d97757">$</text>
<text x="66" y="88" class="mono" font-size="15" fill="#ece9e4">tree arquivos-curso-tec-senac</text>
<text x="48" y="128" class="mono" font-size="15" font-weight="700" fill="#d97757">arquivos-curso-tec-senac/</text>
<text x="48" y="154" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#d97757" font-weight="700">Modulo1/</tspan></text>
<text x="273" y="154" class="mono" font-size="14" fill="#86817a"># primeiro módulo do curso</text>
<text x="48" y="180" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">Alisson - POO/</tspan></text>
<text x="273" y="180" class="mono" font-size="14" fill="#86817a"># Programação Orientada a Objetos</text>
<text x="48" y="206" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">Nelma - DB/</tspan></text>
<text x="273" y="206" class="mono" font-size="14" fill="#86817a"># banco de dados e SQL</text>
<text x="48" y="232" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   ├── <tspan fill="#d97757" font-weight="700">Rodolfo - ALG/</tspan></text>
<text x="273" y="232" class="mono" font-size="14" fill="#86817a"># algoritmos em Portugol e Java</text>
<text x="48" y="258" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   └── <tspan fill="#d97757" font-weight="700">Vanessa - ADS/</tspan></text>
<text x="273" y="258" class="mono" font-size="14" fill="#86817a"># requisitos e UML (PDFs)</text>
<text x="48" y="284" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#d97757" font-weight="700">Modulo2/</tspan></text>
<text x="273" y="284" class="mono" font-size="14" fill="#86817a"># segundo módulo do curso</text>
<text x="48" y="310" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">│   └── <tspan fill="#d97757" font-weight="700">Backend/</tspan></text>
<text x="273" y="310" class="mono" font-size="14" fill="#86817a"># API Spring Boot (aula 22/09)</text>
<text x="48" y="336" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">├── <tspan fill="#ece9e4">.gitignore</tspan></text>

<text x="48" y="362" class="mono" font-size="15" fill="#5c5852" xml:space="preserve">└── <tspan fill="#ece9e4">README.md</tspan></text>

<rect width="1200" height="410" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="409" rx="9.5" fill="none" stroke="#3a3733"/>
</svg>
