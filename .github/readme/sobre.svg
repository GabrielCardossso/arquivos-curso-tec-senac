<rect y="40" width="1200" height="1" fill="#3a3733"/>
<rect x="20" y="14" width="12" height="12" fill="#e5534b"/>
<rect x="40" y="14" width="12" height="12" fill="#e0a43b"/>
<rect x="60" y="14" width="12" height="12" fill="#5fb85f"/>
<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">sobre.md</text>
<rect x="48" y="78" width="10" height="10" fill="#d97757"/>
<text x="70" y="88" class="mono" font-size="18" font-weight="700" fill="#ece9e4">Sobre o projeto</text>
<text x="70" y="122" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve">Projetos, exercícios e práticas desenvolvidos durante o curso<tspan font-weight="700" fill="#ece9e4"> Técnico</tspan><tspan font-weight="700" fill="#ece9e4"> em</tspan><tspan font-weight="700" fill="#ece9e4"> Desenvolvimento</tspan><tspan font-weight="700" fill="#ece9e4"> de</tspan><tspan font-weight="700" fill="#ece9e4"> Sistemas</tspan> no<tspan font-weight="700" fill="#ece9e4"> SENAC</tspan>,</text>
<text x="70" y="149" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve">reunidos para registrar minha evolução:<tspan font-weight="700" fill="#ece9e4"> lógica</tspan><tspan font-weight="700" fill="#ece9e4"> de</tspan><tspan font-weight="700" fill="#ece9e4"> programação</tspan>,<tspan font-weight="700" fill="#ece9e4"> POO</tspan><tspan font-weight="700" fill="#ece9e4"> em</tspan><tspan font-weight="700" fill="#ece9e4"> Java</tspan>,<tspan font-weight="700" fill="#ece9e4"> banco</tspan><tspan font-weight="700" fill="#ece9e4"> de</tspan><tspan font-weight="700" fill="#ece9e4"> dados</tspan> e<tspan font-weight="700" fill="#ece9e4"> back-end</tspan><tspan font-weight="700" fill="#ece9e4"> com</tspan></text>
<text x="70" y="176" class="mono" font-size="16" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">Spring</tspan><tspan font-weight="700" fill="#ece9e4"> Boot</tspan>.</text>
<rect x="48" y="207" width="1104" height="1" fill="#3a3733"/>
<rect x="72" y="228" width="7" height="7" fill="#d97757"/>
<text x="92" y="237" class="mono" font-size="15" fill="#b7b2aa" xml:space="preserve">Atividades de sala, exercícios práticos e avaliações</text>
<rect x="72" y="258" width="7" height="7" fill="#d97757"/>
<text x="92" y="267" class="mono" font-size="15" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">Portugol</tspan>,<tspan font-weight="700" fill="#ece9e4"> Java</tspan>,<tspan font-weight="700" fill="#ece9e4"> SQL</tspan><tspan font-weight="700" fill="#ece9e4"> (PostgreSQL)</tspan> e<tspan font-weight="700" fill="#ece9e4"> Spring</tspan><tspan font-weight="700" fill="#ece9e4"> Boot</tspan></text>
<rect x="72" y="288" width="7" height="7" fill="#d97757"/>
<text x="92" y="297" class="mono" font-size="15" fill="#b7b2aa" xml:space="preserve">Organizado por módulo · Técnico em Desenvolvimento de Sistemas · SENAC</text>
