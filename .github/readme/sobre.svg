<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="333" viewBox="0 0 1200 333" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Sobre arquivos-curso-tec-senac</title>
<desc id="desc">Projetos, exercícios e práticas desenvolvidos durante o curso Técnico em Desenvolvimento de Sistemas no SENAC, reunidos para registrar minha evolução: lógica de programação, POO em Java, banco de dados e back-end com Spring Boot.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
