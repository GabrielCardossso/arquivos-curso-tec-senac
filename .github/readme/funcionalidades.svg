<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Funcionalidades de arquivos-curso-tec-senac</title>
<desc id="desc">Lógica e algoritmos: Exercícios em Portugol (VisualG): recursão, buscas, ordenação, menus e pequenos sistemas. · Ordenação em Java: Quick Sort, Selection Sort e um contador de frequência de palavras. · POO em Java: Classes, construtores, encapsulamento, herança e polimorfismo, aula a aula. · Banco de dados: Scripts SQL de modelagem e consultas com JOIN, incluindo prova e trabalho em grupo. · Requisitos e UML: Jornada do usuário, requisitos, histórias de usuário e casos de uso (PDFs). · API com Spring Boot: CRUD de pessoas e endereços com Spring Data JPA e PostgreSQL (Módulo 2).</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
